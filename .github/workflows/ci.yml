name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gcc-mpi-papi
            name: GCC + MPI + PAPI + Fortran
            cc: gcc
            cxx: g++
            fc: gfortran
            mpi: 1
            papi: 1

          - id: gcc-minimal
            name: GCC + no MPI + no PAPI + Fortran
            cc: gcc
            cxx: g++
            fc: gfortran
            mpi: 0
            papi: 0

          - id: clang-minimal
            name: Clang + no MPI + no PAPI + Fortran
            cc: clang
            cxx: clang++
            fc: gfortran
            mpi: 0
            papi: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            gfortran \
            git \
            python3 \
            python3-pip \
            python3-venv \
            util-linux
          if [[ "${{ matrix.cc }}" == "clang" ]]; then
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang
          fi
          if [[ "${{ matrix.mpi }}" == "1" ]]; then
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mpich libmpich-dev
          fi

      - name: Create Python test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install -r tests/requirements.txt
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Prepare local PAPI cache
        if: ${{ matrix.papi == 1 }}
        run: mkdir -p tests/.deps/cache

      - name: Cache local PAPI tarball
        if: ${{ matrix.papi == 1 }}
        uses: actions/cache@v4
        with:
          path: tests/.deps/cache
          key: papi-${{ runner.os }}-${{ runner.arch }}-7.2.0

      - name: Install local test PAPI
        if: ${{ matrix.papi == 1 }}
        shell: bash
        run: |
          set -euo pipefail
          tests/tools/papi-local/install.sh --jobs "$(nproc)"
          source tests/tools/papi-local/env.sh
          tests/tools/papi-local/doctor.sh

          {
            echo "PAPI_PREFIX=$PAPI_PREFIX"
            echo "PERF_REGIONS_TEST_PAPI_PREFIX=$PERF_REGIONS_TEST_PAPI_PREFIX"
          } >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PAPI_PREFIX/lib:$PAPI_PREFIX/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$PAPI_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          args=(--enable-fortran)
          if [[ "${{ matrix.mpi }}" == "1" ]]; then
            args+=(--enable-mpi)
          else
            args+=(--disable-mpi)
          fi
          if [[ "${{ matrix.papi }}" == "1" ]]; then
            args+=(--enable-papi --with-papi="$PAPI_PREFIX")
          else
            args+=(--disable-papi)
          fi
          ./configure "${args[@]}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" USE_FORTRAN=0 2>&1 | tee "$RUNNER_TEMP/build-nofortran.log"
          make -j"$(nproc)" USE_FORTRAN=1 2>&1 | tee "$RUNNER_TEMP/build-fortran.log"

      - name: Run tests
        shell: bash
        env:
          # The library is still linked against PAPI in the PAPI matrix entry.
          # Free runners normally do not permit hardware counter access, so the
          # required test run uses wallclock timing only.
          USE_PAPI: 0
          USE_MPI: ${{ matrix.mpi }}
          PERF_REGIONS_COUNTERS: WALLCLOCKTIME
        run: |
          set -euo pipefail
          cp config.mk tests/config_tests.mk
          cd tests
          python3 -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Optional PAPI hardware-counter tests
        if: ${{ matrix.papi == 1 }}
        continue-on-error: true
        shell: bash
        env:
          USE_PAPI: 1
          USE_MPI: ${{ matrix.mpi }}
          PERF_REGIONS_COUNTERS: PAPI_TOT_CYC,WALLCLOCKTIME
        run: |
          set -euo pipefail
          if tests/tools/papi-local/doctor.sh --strict; then
            cp config.mk tests/config_tests.mk
            cd tests
            python3 -m pytest -q \
              array_test_c/test_array_test_c.py \
              skip_test_c/test_skip_test_c.py \
              2>&1 | tee "$RUNNER_TEMP/pytest-papi-hardware.log"
          else
            echo "Hardware counters are unavailable; skipping PAPI runtime tests."
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  nvhpc:
    name: NVIDIA HPC SDK + no MPI + no PAPI + Fortran
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Keep this non-blocking until the pinned NVHPC image and compiler version
    # have been validated in the target repository.
    continue-on-error: true

    container:
      # Pin this tag/digest for reproducible CI. Update it deliberately.
      image: nvcr.io/nvidia/nvhpc:25.7-devel-cuda12.9-ubuntu24.04
      options: --user root

    env:
      CC: nvc
      CXX: nvc++
      FC: nvfortran

    steps:
      - name: Bootstrap container tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            make \
            python3 \
            python3-pip \
            python3-venv \
            util-linux

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check NVIDIA compilers
        run: |
          nvc --version
          nvfortran --version

      - name: Create Python test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install -r tests/requirements.txt
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: ./configure --disable-mpi --disable-papi --enable-fortran

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" USE_FORTRAN=0 2>&1 | tee "$RUNNER_TEMP/nvhpc-build-nofortran.log"
          make -j"$(nproc)" USE_FORTRAN=1 2>&1 | tee "$RUNNER_TEMP/nvhpc-build-fortran.log"

      - name: Run tests
        shell: bash
        env:
          USE_PAPI: 0
          USE_MPI: 0
          PERF_REGIONS_COUNTERS: WALLCLOCKTIME
        run: |
          set -euo pipefail
          cp config.mk tests/config_tests.mk
          cd tests
          python3 -m pytest -q 2>&1 | tee "$RUNNER_TEMP/nvhpc-pytest.log"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-nvhpc
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
