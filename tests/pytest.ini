[pytest]
python_files = pytests.py test_*.py *_test.py
testpaths = .
addopts = -ra
markers =
    slow: long-running or high-memory test
    papi_hardware: requires a PAPI-enabled build and working hardware counters
    uncore: requires uncore memory-controller counters
    mpi: requires an MPI-enabled build and run environment
    fortran: requires a Fortran-enabled build
